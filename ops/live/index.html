<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-FrCYRQZKT80re811VogMyI8P82Ix50JuL++ZUxT6VG4='; style-src 'sha256-3luPgQNENp3UfrwCA61ZyxM0geliIPntuYZ0LKlUQhI='; connect-src https://chcxqojugeuzusmjspdp.supabase.co; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aria 지금">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Aria 지금</title>
<style>
:root {
  color-scheme: light;
  --bg: #f2f2f7;
  --card: #ffffff;
  --ink: #000000;
  --ink-2: #6e6e73;
  --hair: #e5e5ea;
  --accent: #2a78d6;
  --accent-strong: #1a5fb0;
  --live: #1f9d55;
  --stale: #b26a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --ink: #ffffff;
    --ink-2: #98989d;
    --hair: #38383a;
    --accent: #3987e5;
    --accent-strong: #7ab0f0;
    --live: #30d158;
    --stale: #ff9f0a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --card: #1c1c1e;
  --ink: #ffffff;
  --ink-2: #98989d;
  --hair: #38383a;
  --accent: #3987e5;
  --accent-strong: #7ab0f0;
  --live: #30d158;
  --stale: #ff9f0a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 480px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
.day { margin: 2px 0 16px; color: var(--ink-2); font-size: 15px; }
.status {
  display: inline-flex; align-items: center; gap: 6px;
  border: 0; border-radius: 999px; padding: 6px 10px;
  background: var(--card); color: var(--ink-2);
  font: inherit; font-size: 13px; font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); }
body[data-state="live"] .dot { background: var(--live); }
body[data-state="stale"] .dot, body[data-state="gone"] .dot { background: var(--stale); }
body[data-state="stale"] .num { opacity: 0.45; }
.card { background: var(--card); border-radius: 18px; padding: 16px; }
main > .card + .card, main > .grid + .card { margin-top: 12px; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.sub b { font-weight: 600; color: var(--ink); }
.unit { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
.num { font-weight: 700; letter-spacing: -0.02em; }
.big { font-size: 64px; line-height: 1.05; }
.mid { font-size: 34px; line-height: 1.15; margin-top: 2px; }
.mid .num { font-weight: 650; }
.hero-row { margin-top: 4px; }
.pair { display: flex; gap: 28px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hair); }
.pair .mid { font-size: 26px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-head .sub { margin: 0; font-variant-numeric: tabular-nums; }
svg { display: block; width: 100%; height: auto; margin-top: 8px; touch-action: pan-y; }
.bar { fill: var(--accent); }
.bar.sel { fill: var(--accent-strong); }
.future { fill: var(--hair); }
.axis { stroke: var(--hair); stroke-width: 1; }
.tick, .val { fill: var(--ink-2); font-size: 11px; font-family: inherit; }
.val { font-weight: 600; fill: var(--ink); }
details { margin-top: 12px; }
summary { color: var(--ink-2); font-size: 13px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--hair); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
.note { margin: 16px 4px 0; color: var(--ink-2); font-size: 12px; line-height: 1.5; }
.note p { margin: 0 0 4px; }
</style>
</head>
<body data-state="loading">
<main>
  <header>
    <h1>Aria 지금</h1>
    <button id="status" class="status" type="button" aria-live="polite"><i class="dot"></i><span id="state">불러오는 중</span></button>
  </header>
  <p class="day" id="day">&nbsp;</p>

  <section class="card">
    <div class="label">지금 쓰는 사람 · 최근 5분</div>
    <div class="hero-row big"><span class="num" id="a5">–</span><span class="unit">명</span></div>
    <div class="pair">
      <div><div class="label">15분</div><div class="mid"><span class="num" id="a15">–</span><span class="unit">명</span></div></div>
      <div><div class="label">1시간</div><div class="mid"><span class="num" id="a60">–</span><span class="unit">명</span></div></div>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="label">오늘 가입</div>
      <div class="mid"><span class="num" id="su">–</span><span class="unit">명</span></div>
      <div class="sub">애플 <b id="suA">–</b> · 게스트 <b id="suG">–</b></div>
    </section>
    <section class="card">
      <div class="label">오늘 질문</div>
      <div class="mid"><span class="num" id="q">–</span><span class="unit">건</span></div>
      <div class="sub">질문한 사람 <b id="qU">–</b>명</div>
    </section>
    <section class="card">
      <div class="label">최근 1시간 대화</div>
      <div class="mid"><span class="num" id="c1h">–</span><span class="unit">명</span></div>
      <div class="sub">질문한 사람</div>
    </section>
    <section class="card">
      <div class="label">구독 중</div>
      <div class="mid"><span class="num" id="sub">–</span><span class="unit">명</span></div>
      <div class="sub">월간 <b id="subM">–</b> · 연간 <b id="subY">–</b></div>
    </section>
  </div>

  <section class="card">
    <div class="chart-head"><div class="label">시간대별 질문</div><div class="sub" id="chQcap">&nbsp;</div></div>
    <svg id="chQ" viewBox="0 0 336 132" role="img" aria-label="오늘 시간대별 질문 수 막대 그래프"></svg>
  </section>

  <section class="card">
    <div class="chart-head"><div class="label">시간대별 가입</div><div class="sub" id="chScap">&nbsp;</div></div>
    <svg id="chS" viewBox="0 0 336 132" role="img" aria-label="오늘 시간대별 가입 수 막대 그래프"></svg>
    <details>
      <summary>표로 보기</summary>
      <table><thead><tr><th>시각</th><th>질문</th><th>가입</th></tr></thead><tbody id="tbody"></tbody></table>
    </details>
  </section>

  <div class="note">
    <p>숫자만 보여요. 이름·이메일·대화 내용은 없어요. 1분마다 새로 고침.</p>
    <p>활동 = 앱 로그인 갱신 또는 AI 요청 · 질문 = 대화 한 번 · 오늘 = 한국 시간 0시부터.</p>
  </div>
</main>
<script>
(() => {
  "use strict";
  const API = "https://chcxqojugeuzusmjspdp.supabase.co/functions/v1/live-stats";
  const REFRESH_MS = 60000;
  const SVGNS = "http://www.w3.org/2000/svg";
  const W = 336, H = 132, TOP = 22, BOT = 20, BAND = W / 24, BW = 8, R = 3;
  const $ = (id) => document.getElementById(id);
  const nf = new Intl.NumberFormat("ko-KR");
  const pad = (n) => String(n).padStart(2, "0");
  const token = (() => {
    const h = location.hash.slice(1);
    try { return decodeURIComponent(h.startsWith("t=") ? h.slice(2) : h); } catch (e) { return ""; }
  })();
  const charts = {};
  let last = null, lastOkAt = 0, timer = 0, busy = false;

  const kstClock = (iso) => {
    const d = new Date(Date.parse(iso) + 9 * 3600000);
    return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds());
  };
  const kstDayLabel = (day) => {
    const [y, m, d] = day.split("-").map(Number);
    const wd = "일월화수목금토"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    return m + "월 " + d + "일 " + wd + "요일";
  };
  const setNum = (id, n) => { $(id).textContent = nf.format(Number(n) || 0); };
  const setState = (kind, text) => { document.body.dataset.state = kind; $("state").textContent = text; };

  function el(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, String(attrs[k]));
    parent.appendChild(e);
    return e;
  }
  function barPath(x, y, w, base) {
    const r = Math.min(R, base - y, w / 2);
    return "M" + x + "," + base + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
      "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + base + "Z";
  }
  function caption(c) {
    const h = c.sel == null ? c.nowH : c.sel;
    $(c.id + "cap").textContent = (c.sel == null ? "지금 " : "") + h + "시 · " + nf.format(c.vals[h] || 0) + c.unit;
    c.svg.querySelectorAll(".bar").forEach((b) => b.classList.toggle("sel", Number(b.dataset.h) === h));
  }
  function chart(id, vals, nowH, unit) {
    const svg = $(id);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const base = H - BOT, plotH = base - TOP;
    const max = Math.max(1, ...vals);
    let peak = 0;
    vals.forEach((v, i) => { if (v > vals[peak]) peak = i; });
    el("line", { x1: 0, x2: W, y1: base + 0.5, y2: base + 0.5, class: "axis" }, svg);
    for (let h = 0; h < 24; h++) {
      const x = h * BAND + (BAND - BW) / 2;
      if (h > nowH) { el("rect", { x: x, y: base - 2, width: BW, height: 2, rx: 1, class: "future" }, svg); continue; }
      const v = vals[h] || 0;
      if (v > 0) {
        const y = base - Math.max(2, (v / max) * plotH);
        el("path", { d: barPath(x, y, BW, base), class: "bar", "data-h": h }, svg);
      }
    }
    if (vals[peak] > 0) {
      const t = el("text", { x: peak * BAND + BAND / 2, y: base - (vals[peak] / max) * plotH - 6, class: "val", "text-anchor": "middle" }, svg);
      t.textContent = nf.format(vals[peak]);
    }
    for (const h of [0, 6, 12, 18]) {
      const t = el("text", { x: h === 0 ? 0 : h * BAND + BAND / 2, y: H - 4, class: "tick", "text-anchor": h === 0 ? "start" : "middle" }, svg);
      t.textContent = h + "시";
    }
    const prev = charts[id];
    const c = { id: id, svg: svg, vals: vals, nowH: nowH, unit: unit, sel: prev && prev.sel != null && prev.sel <= nowH ? prev.sel : null };
    charts[id] = c;
    caption(c);
  }
  function pick(ev) {
    const c = charts[ev.currentTarget.id];
    if (!c) return;
    const r = c.svg.getBoundingClientRect();
    const h = Math.floor(((ev.clientX - r.left) / r.width) * 24);
    c.sel = h >= 0 && h <= c.nowH ? h : null;
    caption(c);
  }
  for (const id of ["chQ", "chS"]) {
    $(id).addEventListener("pointerdown", pick);
    $(id).addEventListener("pointermove", pick);
    $(id).addEventListener("pointerleave", (ev) => { const c = charts[ev.currentTarget.id]; if (c) { c.sel = null; caption(c); } });
  }
  function table(s) {
    const tb = $("tbody");
    while (tb.firstChild) tb.removeChild(tb.firstChild);
    for (let h = 0; h <= s.kst_hour; h++) {
      const tr = document.createElement("tr");
      for (const v of [h + "시", nf.format(s.hourly.questions[h] || 0), nf.format(s.hourly.signups[h] || 0)]) {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
  }
  function render(s) {
    last = s;
    $("day").textContent = kstDayLabel(s.kst_day);
    setNum("a5", s.active.m5); setNum("a15", s.active.m15); setNum("a60", s.active.h1);
    setNum("su", s.signups.total); setNum("suA", s.signups.apple); setNum("suG", s.signups.guest);
    setNum("q", s.chat.questions); setNum("qU", s.chat.askers_today);
    setNum("c1h", s.chat.askers_1h);
    setNum("sub", s.subs.active); setNum("subM", s.subs.monthly); setNum("subY", s.subs.yearly);
    chart("chQ", s.hourly.questions, s.kst_hour, "건");
    chart("chS", s.hourly.signups, s.kst_hour, "명");
    table(s);
  }
  async function load() {
    if (busy) return;
    busy = true;
    clearTimeout(timer);
    try {
      const r = await fetch(API, {
        headers: { "x-live-token": token },
        cache: "no-store",
        credentials: "omit",
        referrerPolicy: "no-referrer",
      });
      if (r.status === 404) { setState("gone", "주소를 다시 확인해 주세요"); return; }
      if (!r.ok) throw new Error("http " + r.status);
      const s = await r.json();
      render(s);
      lastOkAt = Date.now();
      setState("live", "업데이트 " + kstClock(s.at));
    } catch (e) {
      setState("stale", last ? "연결 끊김 · " + kstClock(last.at) : "연결 안 됨");
    } finally {
      busy = false;
      timer = setTimeout(load, REFRESH_MS);
    }
  }
  if (!token) { setState("gone", "주소를 다시 확인해 주세요"); return; }
  $("status").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastOkAt > 20000) load();
  });
  load();
})();
</script>
</body>
</html>
